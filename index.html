<!DOCTYPE html>
<html lang="de" class="light scroll-smooth">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Ursula - 60 Jahre in Bildern</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet"/>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "primary": "#000000",
                        "on-primary": "#ffffff",
                        "surface-container-lowest": "#ffffff",
                        "surface-container-low": "#f3f3f4",
                        "on-surface": "#1a1c1c",
                        "on-surface-variant": "#444748",
                        "secondary": "#5e5e5e",
                        "outline-variant": "#c4c7c7",
                        "tertiary": "#000000"
                    },
                    "spacing": {
                        "container-max": "1200px",
                        "vertical-line-width": "1px",
                        "margin-desktop": "64px",
                        "margin-mobile": "20px"
                    }
                }
            }
        }
    </script>
    <style>
        .font-headline-sm { font-family: 'Outfit', sans-serif; }
        .font-headline-md { font-family: 'Outfit', sans-serif; }
        .font-display-lg { font-family: 'Outfit', sans-serif; }
        .font-display-lg-mobile { font-family: 'Outfit', sans-serif; }
        .font-body-md { font-family: 'Geist', sans-serif; }
        .font-body-lg { font-family: 'Geist', sans-serif; }
        .font-label-sm { font-family: 'Geist', sans-serif; }
        
        /* Subtle interactive micro-depth */
        .image-card {
            transition: box-shadow 0.4s ease, transform 0.4s ease;
            box-shadow: 0 4px 20px rgba(0,0,0,0.04);
            cursor: zoom-in;
        }
        .group:hover .image-card {
            box-shadow: 0 12px 40px rgba(0,0,0,0.08);
            transform: translateY(-4px) scale(1.01);
        }
        
        /* Scroll Reveal Animation */
        .scroll-reveal {
            opacity: 0;
            transform: translateY(40px);
            transition: all 1s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .scroll-reveal.show {
            opacity: 1;
            transform: translateY(0);
        }

        /* Memory Entry Animation */
        .memory-entry {
            animation: fadeIn 0.5s ease forwards;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
    <!-- Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-surface-container-lowest text-on-surface font-body-md antialiased min-h-screen flex flex-col">

    <!-- Hero Section -->
    <section class="relative w-full h-screen flex items-center justify-center overflow-hidden">
        <div class="absolute inset-0 z-0 bg-cover bg-center" style="background-image: url('ursula.jpg');"></div>
        <div class="absolute inset-0 z-10 bg-gradient-to-b from-transparent to-tertiary/60"></div>
        <div class="relative z-20 text-center flex flex-col items-center px-margin-mobile md:px-margin-desktop mt-32">
            <h1 class="font-display-lg-mobile md:font-display-lg text-display-lg-mobile md:text-[80px] tracking-[0.2em] text-on-primary uppercase mb-6 drop-shadow-lg">URSULA</h1>
            <p class="font-headline-md text-headline-md text-on-primary font-light mb-12 drop-shadow-md tracking-wider">60 Jahre in Bildern</p>
            <a href="#gallery" class="border border-on-primary/60 text-on-primary px-8 py-4 rounded-lg hover:bg-on-primary hover:text-primary transition-all duration-300 font-label-sm text-[13px] uppercase tracking-[0.15em] backdrop-blur-sm">
                Zeitreise starten
            </a>
        </div>
    </section>

    <main class="flex-grow" id="gallery">
        <!-- Vertical Timeline Gallery -->
        <section class="relative w-full max-w-container-max mx-auto py-32 px-margin-mobile md:px-margin-desktop">
            <!-- Central Line -->
            <div class="absolute left-1/2 top-0 bottom-0 w-vertical-line-width bg-outline-variant/50 transform -translate-x-1/2 hidden md:block"></div>

            <!-- Dynamischer Timeline Container -->
            <div id="timeline-container"></div>
            
            <div id="loading-indicator" class="text-center text-secondary font-label-sm uppercase tracking-widest my-16">
                Lade Bilder und Erinnerungen...
            </div>

        </section>
    </main>

    <!-- Footer -->
    <footer class="bg-surface-container-lowest border-t border-outline-variant/30 mt-16">
        <div class="flex flex-col justify-center items-center w-full py-16 max-w-container-max mx-auto gap-4">
            <div class="font-headline-sm text-headline-sm text-primary tracking-widest uppercase mb-4">
                Alles Gute zum 60. Geburtstag!
            </div>
            <div class="font-body-md text-body-md text-secondary text-sm">
                Von Herzen, deine Familie.
            </div>
        </div>
    </footer>

    <!-- Lightbox -->
    <div id="lightbox" class="fixed inset-0 z-50 bg-[#0a0a0a]/95 hidden flex flex-col items-center justify-center opacity-0 transition-opacity duration-500 backdrop-blur-xl">
        <button id="lightbox-close" class="absolute top-8 right-8 md:top-12 md:right-12 text-white/60 hover:text-white text-[11px] uppercase tracking-[0.2em] transition-all duration-300 border border-white/20 hover:border-white/80 hover:bg-white/5 px-6 py-3 rounded-full backdrop-blur-md cursor-pointer focus:outline-none">Schließen</button>
        <img id="lightbox-img" src="" alt="" class="max-h-[85vh] max-w-[90vw] object-contain rounded shadow-2xl scale-95 transition-all duration-700 ease-out">
    </div>

    <!-- Modal für neue Erinnerung -->
    <div id="memory-modal" class="fixed inset-0 z-50 bg-[#0a0a0a]/60 hidden flex flex-col items-center justify-center opacity-0 transition-opacity duration-300 backdrop-blur-md">
        <div class="bg-surface-container-lowest p-8 md:p-12 rounded-xl shadow-2xl max-w-lg w-full mx-4 relative transform scale-95 transition-transform duration-300">
            <button id="memory-modal-close" class="absolute top-6 right-6 text-secondary hover:text-primary transition-colors text-3xl font-light leading-none focus:outline-none">&times;</button>
            <h3 class="font-headline-sm text-2xl mb-2 text-primary">Erinnerung teilen</h3>
            <p class="font-body-md text-secondary mb-8 text-[15px]">Hinterlasse eine persönliche Nachricht, Anekdote oder einen Glückwunsch zu diesem Foto.</p>
            
            <form id="memory-form" class="flex flex-col gap-5">
                <input type="hidden" id="memory-image-id">
                
                <div>
                    <label for="author-name" class="block font-label-sm text-[11px] uppercase tracking-widest text-secondary mb-2">Dein Name</label>
                    <input type="text" id="author-name" required class="w-full border border-outline-variant/50 rounded-lg p-3 font-body-md text-primary bg-surface-container-lowest focus:outline-none focus:border-primary transition-colors" placeholder="Max Mustermann">
                </div>
                
                <div>
                    <label for="memory-text" class="block font-label-sm text-[11px] uppercase tracking-widest text-secondary mb-2">Deine Nachricht</label>
                    <textarea id="memory-text" required rows="5" class="w-full border border-outline-variant/50 rounded-lg p-3 font-body-md text-primary bg-surface-container-lowest focus:outline-none focus:border-primary transition-colors resize-none" placeholder="Weißt du noch, als wir..."></textarea>
                </div>
                
                <button type="submit" id="memory-submit-btn" class="mt-2 bg-primary text-on-primary hover:bg-on-surface-variant transition-colors font-label-sm uppercase tracking-[0.15em] py-4 rounded-lg flex justify-center items-center">
                    <span id="submit-text">Speichern</span>
                    <span id="submit-spinner" class="hidden ml-3 w-4 h-4 border-2 border-white/30 border-t-white rounded-full animate-spin"></span>
                </button>
            </form>
        </div>
    </div>

    <!-- Scripts -->
    <script src="js/config.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
